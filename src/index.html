<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Live Calculator</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
            rel="stylesheet"
        />
        <style type="text/css">
            :root {
                --bg-color: #0f172a;
                --glass-bg: rgba(255, 255, 255, 0.05);
                --glass-border: rgba(255, 255, 255, 0.1);
                --text-primary: #ffffff;
                --text-secondary: #94a3b8;
                --accent-color: #8b5cf6;
                --accent-hover: #7c3aed;
                --btn-bg: rgba(255, 255, 255, 0.03);
                --btn-hover: rgba(255, 255, 255, 0.1);
                --equal-bg: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: "Inter", sans-serif;
            }

            body {
                background-color: var(--bg-color);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
                position: relative;
            }

            /* Background Blobs for Atmosphere */
            .background-blobs {
                position: absolute;
                width: 100%;
                height: 100%;
                z-index: 0;
                pointer-events: none;
            }

            .blob {
                position: absolute;
                border-radius: 50%;
                filter: blur(80px);
                opacity: 0.4;
            }

            .blob-1 {
                width: 400px;
                height: 400px;
                background: #4f46e5;
                top: -100px;
                left: -100px;
                animation: float 10s infinite alternate;
            }

            .blob-2 {
                width: 300px;
                height: 300px;
                background: #ec4899;
                bottom: -50px;
                right: -50px;
                animation: float 8s infinite alternate-reverse;
            }

            .blob-3 {
                width: 200px;
                height: 200px;
                background: #06b6d4;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                animation: pulse 12s infinite;
            }

            @keyframes float {
                0% {
                    transform: translate(0, 0);
                }
                100% {
                    transform: translate(30px, 50px);
                }
            }

            @keyframes pulse {
                0% {
                    transform: translate(-50%, -50%) scale(1);
                    opacity: 0.3;
                }
                50% {
                    transform: translate(-50%, -50%) scale(1.2);
                    opacity: 0.5;
                }
                100% {
                    transform: translate(-50%, -50%) scale(1);
                    opacity: 0.3;
                }
            }

            /* Calculator Container */
            .calculator-container {
                position: relative;
                z-index: 1;
                width: 360px;
                background: var(--glass-bg);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid var(--glass-border);
                border-radius: 24px;
                padding: 24px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }

            /* Display Area */
            .display {
                text-align: right;
                margin-bottom: 24px;
                min-height: 100px;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                padding: 0 8px;
            }

            .expression {
                color: var(--text-secondary);
                font-size: 1.2rem;
                min-height: 1.5rem;
                margin-bottom: 8px;
                word-break: break-all;
            }

            .result-preview {
                color: var(--text-primary);
                font-size: 3rem;
                font-weight: 600;
                line-height: 1.1;
                word-break: break-all;
                transition: all 0.3s ease;
            }

            .result-preview.final {
                color: #a855f7;
                text-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            }

            /* Keypad */
            .keypad {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }

            .btn {
                border: none;
                outline: none;
                background: var(--btn-bg);
                color: var(--text-primary);
                font-size: 1.25rem;
                padding: 16px;
                border-radius: 16px;
                cursor: pointer;
                transition: all 0.2s ease;
                user-select: none;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .btn:hover {
                background: var(--btn-hover);
                transform: translateY(-2px);
            }

            .btn:active {
                transform: translateY(0);
            }

            .btn-operator {
                color: #a855f7;
                font-weight: 600;
            }

            .btn-action {
                color: #ef4444;
                font-weight: 600;
            }

            .btn-zero {
                grid-column: span 2;
            }

            .btn-equal {
                background: var(--equal-bg);
                box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
            }

            .btn-equal:hover {
                background: var(--equal-bg);
                filter: brightness(1.1);
                box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
            }
        </style>
    </head>
    <body>
        <div class="background-blobs">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <div class="calculator-container">
            <div class="display">
                <div class="expression" id="expression"></div>
                <div class="result-preview" id="result-preview">0</div>
            </div>

            <div class="keypad">
                <button class="btn btn-action" data-action="clear">AC</button>
                <button class="btn btn-action" data-action="delete">⌫</button>
                <button class="btn btn-operator" data-value="%">%</button>
                <button class="btn btn-operator" data-value="/">÷</button>

                <button class="btn btn-number" data-value="7">7</button>
                <button class="btn btn-number" data-value="8">8</button>
                <button class="btn btn-number" data-value="9">9</button>
                <button class="btn btn-operator" data-value="*">×</button>

                <button class="btn btn-number" data-value="4">4</button>
                <button class="btn btn-number" data-value="5">5</button>
                <button class="btn btn-number" data-value="6">6</button>
                <button class="btn btn-operator" data-value="-">-</button>

                <button class="btn btn-number" data-value="1">1</button>
                <button class="btn btn-number" data-value="2">2</button>
                <button class="btn btn-number" data-value="3">3</button>
                <button class="btn btn-operator" data-value="+">+</button>

                <button class="btn btn-number btn-zero" data-value="0">
                    0
                </button>
                <button class="btn btn-number" data-value=".">.</button>
                <button class="btn btn-equal" data-action="calculate">=</button>
            </div>
        </div>

        <script type="text/javascript">
            document.addEventListener("DOMContentLoaded", () => {
                const expressionEl = document.getElementById("expression");
                const resultPreviewEl =
                    document.getElementById("result-preview");
                const buttons = document.querySelectorAll(".btn");

                let currentExpression = "";
                let isResultFinal = false;

                // Helper to format numbers (optional, can be enhanced)
                const formatNumber = (num) => {
                    // Simple formatting to avoid long decimals
                    const n = Number(num);
                    if (isNaN(n)) return "Error";
                    // Limit to 8 decimal places and remove trailing zeros
                    return parseFloat(n.toFixed(8)).toString();
                };

                // Safe evaluation function
                const safeEvaluate = (expr) => {
                    try {
                        // Replace visual operators with JS operators
                        const evalExpr = expr
                            .replace(/×/g, "*")
                            .replace(/÷/g, "/")
                            .replace(/%/g, "/100");

                        // Check if expression ends with an operator, if so, ignore the last operator for preview
                        if (/[+\-*/.]$/.test(evalExpr)) {
                            return null;
                        }

                        // Using Function constructor as a safer alternative to eval,
                        // though for a calculator, strict input validation is key.
                        // Here we only allow numbers and operators via UI, so it's relatively safe.
                        // We can also use a library like math.js for more complex needs, but vanilla is fine here.
                        const result = new Function("return " + evalExpr)();

                        if (!isFinite(result) || isNaN(result)) return "Error";
                        return result;
                    } catch (e) {
                        return null;
                    }
                };

                const updateDisplay = (final = false) => {
                    expressionEl.textContent = currentExpression
                        .replace(/\*/g, "×")
                        .replace(/\//g, "÷");

                    if (!currentExpression) {
                        resultPreviewEl.textContent = "0";
                        resultPreviewEl.classList.remove("final");
                        return;
                    }

                    const result = safeEvaluate(currentExpression);

                    if (final) {
                        if (result !== null) {
                            resultPreviewEl.textContent = formatNumber(result);
                            resultPreviewEl.classList.add("final");
                            // Update expression to result for next operation if needed,
                            // but per requirements: "再输入就开始一次新的计算" (Inputting again starts new calc)
                            // We handle this in handleInput.
                        } else {
                            // If invalid expression on equals (e.g. "5+"), keep it or show error?
                            // Usually calculators just ignore or show current state.
                            // Let's show what we have.
                        }
                    } else {
                        resultPreviewEl.classList.remove("final");
                        if (result !== null) {
                            resultPreviewEl.textContent = formatNumber(result);
                        } else {
                            // If we can't evaluate (e.g. incomplete expression "5+"),
                            // we might want to show the previous valid result or just nothing/current input?
                            // Requirement: "real-time calculation".
                            // If I type "5+", result is 5. If "5+3", result is 8.
                            // Let's try to evaluate the partial expression if possible, or just keep previous.
                            // Actually, standard behavior: if "5+", preview might still be 5.
                            // Let's try to strip trailing operators for preview.
                            const partialExpr = currentExpression.replace(
                                /[+\-*/.]+$/,
                                "",
                            );
                            if (partialExpr) {
                                const partialRes = safeEvaluate(partialExpr);
                                if (partialRes !== null) {
                                    resultPreviewEl.textContent =
                                        formatNumber(partialRes);
                                }
                            }
                        }
                    }
                };

                const handleInput = (value, type) => {
                    if (type === "number") {
                        if (isResultFinal) {
                            // Start new calculation
                            currentExpression = value;
                            isResultFinal = false;
                        } else {
                            currentExpression += value;
                        }
                    } else if (type === "operator") {
                        if (isResultFinal) {
                            // Continue with result
                            const currentResult = resultPreviewEl.textContent;
                            if (currentResult !== "Error") {
                                currentExpression = currentResult + value;
                                isResultFinal = false;
                            } else {
                                currentExpression = ""; // Reset if error
                                isResultFinal = false;
                            }
                        } else {
                            // Prevent multiple operators in a row (replace last one)
                            if (/[+\-*/.]$/.test(currentExpression)) {
                                currentExpression =
                                    currentExpression.slice(0, -1) + value;
                            } else {
                                currentExpression += value;
                            }
                        }
                    } else if (type === "action") {
                        if (value === "clear") {
                            currentExpression = "";
                            isResultFinal = false;
                        } else if (value === "delete") {
                            if (isResultFinal) {
                                currentExpression = "";
                                isResultFinal = false;
                            } else {
                                currentExpression = currentExpression.slice(
                                    0,
                                    -1,
                                );
                            }
                        } else if (value === "calculate") {
                            updateDisplay(true);
                            isResultFinal = true;
                            return; // updateDisplay handles the UI
                        }
                    }
                    updateDisplay();
                };

                buttons.forEach((btn) => {
                    btn.addEventListener("click", () => {
                        const value = btn.dataset.value;
                        const action = btn.dataset.action;

                        if (value) {
                            if (["+", "-", "*", "/", "%"].includes(value)) {
                                handleInput(value, "operator");
                            } else {
                                handleInput(value, "number");
                            }
                        } else if (action) {
                            handleInput(action, "action");
                        }
                    });
                });

                // Keyboard support (optional but good)
                document.addEventListener("keydown", (e) => {
                    const key = e.key;
                    if (/[0-9.]/.test(key)) {
                        handleInput(key, "number");
                    } else if (["+", "-", "*", "/"].includes(key)) {
                        handleInput(key, "operator");
                    } else if (key === "Enter" || key === "=") {
                        handleInput("calculate", "action");
                    } else if (key === "Backspace") {
                        handleInput("delete", "action");
                    } else if (key === "Escape") {
                        handleInput("clear", "action");
                    }
                });
            });
        </script>
    </body>
</html>
